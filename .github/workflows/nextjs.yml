# 构建并把 Next.js 静态导出站点部署到 GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]     # 默认分支是 master 就改这里
  workflow_dispatch:        # 允许在 Actions 页面手动触发

# 部署 Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送自动取消旧的
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pages 返回 base_path：项目站 → /<仓库名>，用户站 → 空
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Next.js (static export)
        run: bun run build
        env:
          DEPLOY_TARGET: pages        # 让 next.config.ts 走 output: "export" 分支
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify static export output
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/ 不存在 —— 构建没走静态导出分支。请确认 next.config.ts 是 GITHUB_EXPORT 双模式版本"
            exit 1
          fi

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
