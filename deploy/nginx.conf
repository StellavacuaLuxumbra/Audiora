# Nginx 反向代理示例 — 自建服务器部署时使用
# 用法: 拷贝到 /etc/nginx/conf.d/guansheng.conf 后执行 nginx -s reload

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或服务器 IP

    # Next.js 静态资源体积较大, 开启压缩
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # 带哈希指纹的静态资源: 一年强缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
